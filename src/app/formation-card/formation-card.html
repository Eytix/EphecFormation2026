<a class="group block h-full rounded-xl text-inherit no-underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-rose-700"
   [routerLink]="['/formation', formationInput().id]">
  <mat-card class="flex! h-full flex-col transition duration-150 ease-in-out group-hover:-translate-y-0.5 group-hover:shadow-md! group-focus-visible:-translate-y-0.5 group-focus-visible:shadow-md!"
            appearance="outlined">
    <mat-card-header>
      <mat-card-title class="text-xl!">{{ formationInput().title }}</mat-card-title>
    </mat-card-header>

    <mat-card-content class="flex-1 pt-2!">
      <div class="flex flex-wrap gap-4 text-sm font-medium text-gray-600">
        <span class="inline-flex items-center gap-1">
          <mat-icon class="size-[18px]! text-[18px]! text-rose-700">place</mat-icon>
          {{ formationInput().location }}
        </span>
        <span class="inline-flex items-center gap-1">
          <mat-icon class="size-[18px]! text-[18px]! text-rose-700">event</mat-icon>
          {{ formationInput().date | date: 'dd/MM/yyyy' }}
        </span>
      </div>

      <!-- Limite la description à 4 lignes pour que les cartes restent homogènes -->
      <p class="mt-3 line-clamp-4">{{ formationInput().description }}</p>
    </mat-card-content>

    @if (formationInput().tags.length) {
      <mat-card-footer class="px-4 pb-4">
        <mat-chip-set aria-label="Tags">
          @for (tag of formationInput().tags; track tag) {
            <mat-chip [class.bg-pink-400!]="isAngular(tag)">{{ tag }}</mat-chip>
          }
        </mat-chip-set>
      </mat-card-footer>
    }
  </mat-card>
</a>
