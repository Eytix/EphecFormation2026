<div class="flex h-full flex-col">
  <app-header (menuToggle)="drawer.toggle()"></app-header>

  <mat-sidenav-container class="flex-1">
    <mat-sidenav #drawer class="w-60" [mode]="isMobile() ? 'over' : 'side'" [opened]="!isMobile()">
      <app-sidenav (click)="isMobile() && drawer.close()"></app-sidenav>
    </mat-sidenav>

    <mat-sidenav-content class="flex! flex-col">
      <app-content class="flex-1"></app-content>
      <app-footer></app-footer>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
